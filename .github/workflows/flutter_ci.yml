name: Flutter CI

# Runs on every push/PR to main & develop, plus any PR targeting them.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

# Cancel older in-progress runs on the same branch/PR when a new commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.3' # pin this to whatever `flutter --version` shows locally

jobs:
  analyze_and_test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Runs build_runner if the project uses freezed/json_serializable/riverpod_generator.
      # Safe no-op if there's nothing to generate.
      - name: Run code generation
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner dependency — skipping codegen."
          fi

      # Non-blocking for now — Phase 1 is moving fast and formatting drift
      # shouldn't stall the pipeline. Flip `continue-on-error` to `false`
      # once the codebase is formatted and you want this enforced strictly.
      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # No --fatal-infos / --fatal-warnings: those would fail the build on
      # style nits and deprecation notices. This only fails on real errors.
      # Warnings/infos still print in the log so they stay visible.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build_debug_apk:
    name: Build debug APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner dependency — skipping codegen."
          fi

      # Debug build only — no signing config needed yet (Phase 1).
      # Swap to `flutter build apk --release` once a keystore secret is wired up.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
name: swarna_bindu
description: Bindu Gold Scheme — Digital gold savings platform for jewellery stores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_screenutil: ^5.9.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
